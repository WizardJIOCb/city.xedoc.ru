server {
    listen 80;
    listen [::]:80;
    server_name city.xedoc.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://city.xedoc.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name city.xedoc.ru;
    root /var/www/city.xedoc.ru/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/city.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/city.xedoc.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/city.xedoc.ru.access.log;
    error_log /var/log/nginx/city.xedoc.ru.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location /api/geo/ {
        proxy_pass http://127.0.0.1:5190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_buffering on;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}
