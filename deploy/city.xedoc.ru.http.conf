# Bootstrap HTTP only, used before the first Let's Encrypt certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name city.xedoc.ru;
    root /var/www/city.xedoc.ru/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
